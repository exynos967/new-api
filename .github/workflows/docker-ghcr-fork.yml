name: Publish Docker image to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    name: Build and push image (amd64)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Prepare image metadata
        id: vars
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          {
            echo "image=ghcr.io/${repo}"
            echo "version=custom-$(date +'%Y%m%d')-${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      - name: Write version
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: echo "$VERSION" > VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.version }}-amd64
          cache-from: type=gha,scope=ghcr-amd64
          cache-to: type=gha,mode=max,scope=ghcr-amd64
          provenance: false
          sbom: false

      - name: Publish latest manifest
        shell: bash
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64"

      - name: Output image tags
        shell: bash
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          {
            echo "### Published image"
            echo '```'
            echo "$IMAGE:$VERSION-amd64"
            echo "$IMAGE:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
